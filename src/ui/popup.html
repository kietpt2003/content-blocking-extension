<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="extension_name">Home Content Blocker</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <header>
      <img src="icons/48.png" width="36" height="36" alt="" />
      <div>
        <strong data-i18n="extension_name">Home Content Blocker</strong
        ><span class="muted"
          ><span data-i18n="popup_subtitle">Bộ lọc trên trình duyệt</span> ·
          <span id="version"></span
        ></span>
      </div>
    </header>
    <main>
      <label class="switch-row hero"
        ><span
          ><strong data-i18n="enabled_label">Bật bộ lọc</strong
          ><small data-i18n="popup_enabled_hint">Domain và nội dung trang</small></span
        ><input id="enabled" type="checkbox" role="switch" disabled
      /></label>
      <label class="switch-row"
        ><span
          ><strong data-i18n="xvideos_label">Chặn QC XVideos</strong
          ><small data-i18n="popup_xvideos_hint"
            >Tải lại clip sau khi đổi; cần bật Chặn domain / URL trong cài đặt.</small
          ></span
        ><input id="xvideos" type="checkbox" role="switch" disabled
      /></label>
      <label class="switch-row"
        ><span
          ><strong data-i18n="vlxx_label">Chặn QC VLXX</strong
          ><small data-i18n="popup_vlxx_hint"
            >vlxx.app / vlxx.phd. Tải lại clip sau khi đổi; cần bật chặn URL và ẩn HTML trong cài
            đặt.</small
          ></span
        ><input id="vlxx" type="checkbox" role="switch" disabled
      /></label>
      <label class="switch-row"
        ><span
          ><strong data-i18n="viet69_label">Chặn QC Viet69</strong
          ><small data-i18n="popup_viet69_hint"
            >viet69.be. Tải lại trang sau khi đổi; cần bật chặn URL và ẩn HTML trong cài đặt.</small
          ></span
        ><input id="viet69" type="checkbox" role="switch" disabled
      /></label>
      <label class="switch-row"
        ><span
          ><strong data-i18n="vnsextop_label">Chặn QC VNSexTop</strong
          ><small data-i18n="popup_vnsextop_hint"
            >vnsextop1.pro. Tải lại trang sau khi đổi; cần bật chặn URL và ẩn HTML trong cài
            đặt.</small
          ></span
        ><input id="vnsextop" type="checkbox" role="switch" disabled
      /></label>
      <section class="card">
        <span class="eyebrow" data-i18n="popup_current">TRANG HIỆN TẠI</span
        ><strong id="host" data-i18n="loading_page">Đang đọc…</strong>
        <p id="hidden-summary"><b id="hidden">0</b> thành phần đang được ẩn</p>
        <button id="site-toggle" class="secondary" disabled data-i18n="site_disable">
          Tạm tắt trên website này
        </button>
      </section>
      <section id="youtube-panel" class="card" hidden>
        <span class="eyebrow" data-i18n="youtube_diagnostics">CHẨN ĐOÁN YOUTUBE</span>
        <p id="youtube-state" data-i18n="loading_filter">Đang đọc bộ lọc…</p>
        <p id="youtube-counts"></p>
        <p id="network-state"></p>
        <button id="capture-network" class="secondary" data-i18n="capture_start">
          Ghi 60 giây và tải lại tab
        </button>
        <button id="clear-network" class="quiet" data-i18n="capture_clear">
          Xóa bản ghi request
        </button>
        <button id="copy-diagnostics" class="secondary" data-i18n="copy_diagnostics">
          Sao chép chẩn đoán
        </button>
      </section>
      <p class="hint" data-i18n="popup_badge_hint">
        Số trên biểu tượng là request bị chặn. Số ở đây là thành phần HTML đang ẩn, không phải số
        quảng cáo trong video.
      </p>
      <button id="options" class="primary" data-i18n="open_options">
        Mở cài đặt &amp; quy tắc
      </button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
